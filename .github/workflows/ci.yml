name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Enable Linux sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$userns" ] && [ "$userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$apparmor" ] && [ "$apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-net --die-with-parent --ro-bind / / --proc /proc /bin/sh -c true
      - name: install pinned tectonic (deterministic LaTeX toolchain)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            asset="tectonic-0.15.0-aarch64-apple-darwin.tar.gz"
          else
            asset="tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz"
          fi
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/${asset}" \
            -o tectonic.tar.gz
          tar -xzf tectonic.tar.gz tectonic
          sudo mv tectonic /usr/local/bin/tectonic
          rm tectonic.tar.gz
          tectonic --version
      - name: cache tectonic bundle
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Tectonic
            ~/.cache/Tectonic
          key: tectonic-bundle-${{ runner.os }}-0.15.0
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
